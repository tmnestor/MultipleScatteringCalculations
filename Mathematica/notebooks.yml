# How each Wolfram file in this folder becomes a notebook: read by scripts/build_notebooks.py.
# Every key of an entry is required; an empty value is written explicitly ([] , {}, null).
#   kind     script | library (built into a notebook) | data | tool (no notebook)
#   release  true for exactly the Wolfram files the reproduction repository ships
#   evaluate true: the notebook is saved with its outputs
#   reads    calls whose file the builder cannot read off the source, keyed "File.wl: call", with the
#            files they read relative to that file ([] for the moment cache, which is never tracked)
max_notebook_bytes: 5000000
require_every_script_listed: false
notebooks:
  ContinuumLimit_AveragedSums.wl:
    kind: script
    release: true
    evaluate: true
    args: []
    reads: {}
    allowed_messages: []
    extra_cells: []
