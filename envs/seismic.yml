# =============================================================================
# CONDA ENVIRONMENT CRUD COMMANDS - QUICK REFERENCE
# =============================================================================
#
# Exported with: conda env export -n seismic --no-builds (prefix line removed)
#
# Environment location (macOS):
# /opt/homebrew/Caskroom/miniforge/base/envs/seismic
#
# CREATE: conda env create -f envs/seismic.yml
# READ:   conda env list ; conda list -n seismic
# UPDATE: conda env update -n seismic -f envs/seismic.yml --prune
#         (--prune removes anything not listed here; re-export after any install)
# DELETE: conda env remove -n seismic
# ACTIVATE:   conda activate seismic
# DEACTIVATE: conda deactivate
# EXPORT: conda env export -n seismic --no-builds > envs/seismic.yml
# CLONE:  conda create --name seismic_copy --clone seismic
