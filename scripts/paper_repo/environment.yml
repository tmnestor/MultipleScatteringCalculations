name: continuum-limit
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - matplotlib
  - sympy
  - mpmath
  - pyyaml
  - pytorch
  - pytest
  - pytest-xdist
  # the compiled point kernel (cubic_scattering/fortran): compiler and build system, from the same
  # channel so the extension links the OpenMP runtime that OpenBLAS uses
  - gfortran
  - meson
  - ninja
