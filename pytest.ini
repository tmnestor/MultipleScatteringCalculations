[pytest]
# Three tiers:
#   edit loop:                     pytest --testmon -m "not slow"   (only tests whose code changed)
#   gate, before every commit:     pytest -n auto --dist worksteal -m "not slow"
#   full suite, before a release:  pytest -n auto --dist worksteal
# A test that is not marked slow must finish (setup and body each) within slow_budget_seconds, or it fails
# with the instruction to mark it or make it faster (cubic_scattering/tests/time_budget.py).
markers =
    slow: long-running tests (large Foldy-Lax solves); deselect with -m "not slow"
slow_budget_seconds = 10
